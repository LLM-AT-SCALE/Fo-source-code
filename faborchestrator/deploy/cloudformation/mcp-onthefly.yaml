AWSTemplateFormatVersion: '2010-09-09'

# =============================================================================
# On-the-Fly MCP — pre-provisioned SUBSTRATE (provision ONCE).
#
# Account 628203515088, region us-west-2. Shared (Athena) VPC vpc-0521d5dc5d2554e5a.
#
# This template creates everything that is REUSED across every on-the-fly MCP
# server, so that "creating a server" at runtime only deploys a per-source Lambda
# FUNCTION onto this fixed substrate — never a new IAM role, VPC, or SG. That is
# the reconciliation of the two approved choices: literal per-source codegen +
# deploy, but on a substrate provisioned once (no on-the-fly IAM/VPC — the
# Critical risk the DOCX calls out is designed out here).
#
# Creates:
#   • S3 artifact bucket for generated deployment zips (private, versioned, TTL).
#   • ONE least-privilege Lambda execution role shared by all runtime functions.
#   • ONE security group (egress to the target DB port only) for the in-VPC runtime.
#   • A managed policy attached to the ADMIN app's EB instance role granting the
#     narrowly-scoped deploy permissions (mcp-otf-* functions, mcp/onthefly/*
#     secrets, the artifact bucket, and PassRole on ONLY the runtime role).
#   • An AWS Budget (cost guardrail) scoped by tag.
#
# Nothing here is generated by the LLM. DDL/infra + IAM are ask-first — validate
# and review before deploying:
#   aws cloudformation validate-template --template-body file://cloudformation/mcp-onthefly.yaml --region us-west-2
# =============================================================================

Description: >-
  On-the-Fly MCP substrate (account 628203515088, us-west-2): shared Lambda
  execution role, in-VPC runtime security group, artifact bucket, scoped deploy
  permissions for the admin app, and a cost budget. Provisioned once; per-source
  MCP runtime functions deploy onto it.

Parameters:
  NamePrefix:
    Type: String
    Default: mcp-otf
    Description: Name prefix for all resources created by this template.

  SharedVpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-0521d5dc5d2554e5a
    Description: The Athena shared VPC the runtime Lambdas attach to.

  RuntimeSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Default: subnet-06faf688f0ea464ac,subnet-0e0f6ddda096487f3,subnet-07a09ab450b741c55
    Description: >-
      Private/instance subnets in the shared VPC for the runtime Lambda ENIs
      (same subnets the admin env uses).

  TargetDbPort:
    Type: Number
    Default: 5432
    Description: >-
      Egress port the runtime SG may reach on the target DB (Postgres 5432). The
      SG allows egress to this port only; per-target ingress on the target's own
      SG is added out of band (ask-first) when a source is created.

  AdminInstanceRoleName:
    Type: String
    Default: ''
    Description: >-
      Optional. Name of an existing role to attach the deploy policy to (the
      former admin EB instance role, aws-elasticbeanstalk-ec2-role). Leave empty
      for the per-module deployment: service.yaml attaches the policy to the
      admin task role by ARN (output AdminDeployPolicyArn).

  ArtifactBucketName:
    Type: String
    Default: mcp-otf-artifacts-628203515088
    Description: S3 bucket holding generated deployment zips.

  BudgetLimitUsd:
    Type: Number
    Default: 50
    Description: Monthly USD budget for tagged on-the-fly MCP resources (cost guardrail).

  BudgetNotificationEmail:
    Type: String
    Default: athenatec@llmatscale.ai
    Description: Email that receives the 80% / 100% budget alerts.

Conditions:
  HasAdminRole: !Not [!Equals [!Ref AdminInstanceRoleName, '']]

Resources:

  # --- 1) Artifact bucket for generated deployment zips ---------------------
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref ArtifactBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-artifacts
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            ExpirationInDays: 90
      Tags:
        - Key: feature
          Value: mcp-onthefly

  # --- 2) Shared least-privilege runtime execution role --------------------
  RuntimeExecRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${NamePrefix}-runtime-exec'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      # AWS-managed policy that grants ONLY the VPC ENI + CloudWatch Logs perms
      # a VPC Lambda needs.
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: read-onthefly-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Runtime may read ONLY secrets under the mcp/onthefly/ prefix.
              - Sid: ReadOnTheFlySecrets
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:mcp/onthefly/*'
      Tags:
        - Key: feature
          Value: mcp-onthefly

  # --- 3) Runtime security group (egress to the target DB port only) -------
  RuntimeSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${NamePrefix}-runtime-sg'
      GroupDescription: On-the-fly MCP runtime Lambda egress to target DB (read-only).
      VpcId: !Ref SharedVpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: !Ref TargetDbPort
          ToPort: !Ref TargetDbPort
          CidrIp: 0.0.0.0/0
          Description: Egress to target Postgres (in-VPC / peered). No other egress.
      Tags:
        - Key: feature
          Value: mcp-onthefly
        - Key: Name
          Value: !Sub '${NamePrefix}-runtime-sg'

  # --- 4) Scoped deploy permissions for the ADMIN app ----------------------
  #     Attached to the admin EB instance role. Lets the app create/update/delete
  #     ONLY mcp-otf-* functions, manage ONLY mcp/onthefly/* secrets, write the
  #     artifact bucket, and PassRole ONLY the runtime role. No broad AWS access.
  AdminDeployPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${NamePrefix}-admin-deploy'
      Description: Narrowly-scoped on-the-fly MCP deploy permissions for the admin app.
      Roles: !If [HasAdminRole, [!Ref AdminInstanceRoleName], !Ref 'AWS::NoValue']
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ManageOnTheFlyFunctions
            Effect: Allow
            Action:
              - lambda:CreateFunction
              - lambda:UpdateFunctionCode
              - lambda:UpdateFunctionConfiguration
              - lambda:DeleteFunction
              - lambda:GetFunction
              - lambda:GetFunctionConfiguration
              - lambda:CreateFunctionUrlConfig
              - lambda:UpdateFunctionUrlConfig
              - lambda:DeleteFunctionUrlConfig
              - lambda:GetFunctionUrlConfig
              - lambda:AddPermission
              - lambda:RemovePermission
              - lambda:PutFunctionConcurrency
              - lambda:TagResource
              - lambda:ListTags
              - lambda:InvokeFunction
            Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${NamePrefix}-*'
          - Sid: ManageOnTheFlySecrets
            Effect: Allow
            Action:
              - secretsmanager:CreateSecret
              - secretsmanager:PutSecretValue
              - secretsmanager:TagResource
              - secretsmanager:DeleteSecret
              - secretsmanager:DescribeSecret
              - secretsmanager:GetSecretValue
            Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:mcp/onthefly/*'
          - Sid: WriteArtifacts
            Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
              - s3:DeleteObject
            Resource: !Sub 'arn:aws:s3:::${ArtifactBucketName}/*'
          - Sid: PassOnlyRuntimeRole
            Effect: Allow
            Action: iam:PassRole
            Resource: !GetAtt RuntimeExecRole.Arn
            Condition:
              StringEquals:
                iam:PassedToService: lambda.amazonaws.com

  # --- 5) Cost guardrail: monthly budget scoped by tag ---------------------
  CostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub '${NamePrefix}-monthly'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref BudgetLimitUsd
          Unit: USD
        CostFilters:
          TagKeyValue:
            - 'user:feature$mcp-onthefly'
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetNotificationEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetNotificationEmail

Outputs:
  ArtifactBucket:
    Description: S3 bucket for generated deployment zips.
    Value: !Ref ArtifactBucket
  RuntimeExecRoleArn:
    Description: Shared execution role ARN passed to every runtime function.
    Value: !GetAtt RuntimeExecRole.Arn
  RuntimeSecurityGroupId:
    Description: Security group id for the in-VPC runtime functions.
    Value: !Ref RuntimeSecurityGroup
  RuntimeSubnetIds:
    Description: Subnets the runtime functions attach to.
    Value: !Join [',', !Ref RuntimeSubnetIds]
  AdminDeployPolicyArn:
    Description: Managed policy granting the admin app scoped deploy permissions.
    Value: !Ref AdminDeployPolicy
