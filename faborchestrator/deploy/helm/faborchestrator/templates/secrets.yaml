{{- /*
Secrets Manager -> one Kubernetes Secret (fab-app-secrets) read by every module.
The External Secrets controller reads with its own Pod Identity role
(eks-workload-iam.yaml, fo-dev/app/* only); app pods never call Secrets Manager
for these values.
*/ -}}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: {{ .Release.Namespace }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.awsRegion }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fab-app-secrets
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: fab-app-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        {{- range $name, $_ := .Values.secrets.keys }}
        {{ $name }}: "{{ printf "{{ .%s }}" ($name | lower) }}"
        {{- end }}
        {{- with .Values.secrets.database }}
        DATABASE_URL: "postgresql://{{ .user }}:{{ "{{" }} .db_password | urlquery {{ "}}" }}@{{ .host }}:{{ .port }}/{{ .name }}"
        {{- end }}
  data:
    {{- range $name, $secretId := .Values.secrets.keys }}
    - secretKey: {{ $name | lower }}
      remoteRef:
        key: {{ $secretId }}
    {{- end }}
    - secretKey: db_password
      remoteRef:
        key: {{ .Values.secrets.database.passwordSecret }}
